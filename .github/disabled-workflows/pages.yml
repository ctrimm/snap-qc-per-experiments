# Publishes outputs/ (the state map and the report) to GitHub Pages.
# Needs Settings > Pages > Source set to "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths: [outputs/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site from outputs/
        run: |
          mkdir _site
          cp -R outputs/state_map outputs/report _site/
          # The site root sends visitors to the map.
          printf '<!doctype html><meta charset="utf-8"><title>SNAP triage rankers by state</title><meta http-equiv="refresh" content="0; url=state_map/"><a href="state_map/">SNAP triage rankers by state</a>\n' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
